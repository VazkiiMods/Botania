name: Bug Report
description: Report an issue with supported versions of Botania (Not for help requests!)
body:
  - type: markdown
    attributes:
      value: |
        Please do not use GitHub issues to post ideas or request help.
        Ideas should be posted on the [Botania forums](https://forum.violetmoon.org/t/botania), or discussed on the [Violet Moon discord](https://discord.gg/vm).
        The Discord is also the place to request help with compatibility issues first, especially for older Minecraft versions.
  - type: dropdown
    id: modloader
    attributes:
      label: Mod Loader
      options:
        - (Neo)Forge
        - Fabric
        - Both Fabric and (Neo)Forge (I confirm that I have tested both loaders and will specify both loader versions below)
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft Version
      placeholder: eg. 1.20.1
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Botania version
      placeholder: eg. 1.20.1-440
    validations:
      required: true
  - type: input
    id: modloader-version
    attributes:
      label: Modloader version
      description: |
        List the version of the mod loader you are using.
        If on Fabric, post the versions of both Fabric Loader and Fabric API.
      placeholder: "eg. Forge: 47.1.3 / NeoForge: 21.1.217 / Fabric: Loader 0.18.4 + API 0.92.6"
    validations:
      required: true
  - type: input
    id: modpack
    attributes:
      label: Modpack info
      description: |
        If playing a modpack, post the link to it!
  - type: input
    attributes:
      label: "The latest.log file"
      description: "Please use a paste site such as [gist](https://gist.github.com/) / [pastebin](https://pastebin.com/) / etc."
    validations:
      required: true
  - type: textarea
    attributes:
      label: Issue description
      placeholder: A description of the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. First step
        2. Second step
        3. etc...
  - type: textarea
    attributes:
      label: Other information
      description: Any other relevant information that is related to this issue, such as other mods and their versions.
